name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run check:tsc

      - name: Lint
        run: npm run check:lint

      - name: Prettier
        run: npm run check:prettier

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
